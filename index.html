<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>SILO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  /* Every size is measured from the 9:16 frame: --u is 1% of the frame's width. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  body.idle, body.idle * { cursor: none !important; }
  #frame { position: absolute; overflow: hidden; background: #000; --u: 4px; color: #e9e2cf; font-family: 'Share Tech Mono', ui-monospace, Consolas, monospace; --amber: #e8b446; }
  #frame > * { position: absolute; inset: 0; }
  #c { width: 100%; height: 100%; display: block; }
  .ov { pointer-events: none; opacity: 0; }

  /* the helmet display: dark rounded edge, scan lines, small marks */
  #helmet .edge { position: absolute; inset: calc(var(--u) * -6); border-radius: 30%; box-shadow: inset 0 0 calc(var(--u) * 16) calc(var(--u) * 13) #000; }
  #helmet .scan { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .16) 0 1px, transparent 1px 4px); mix-blend-mode: multiply; }
  #helmet b { position: absolute; width: calc(var(--u) * 5); height: calc(var(--u) * 5); border: calc(var(--u) * .35) solid rgba(210, 255, 225, .55); }
  #helmet b.a { left: 14%; top: 13%; border-right: 0; border-bottom: 0; } #helmet b.b { right: 14%; top: 13%; border-left: 0; border-bottom: 0; }
  #helmet b.c { left: 14%; bottom: 25%; border-right: 0; border-top: 0; } #helmet b.d { right: 14%; bottom: 25%; border-left: 0; border-top: 0; }
  #glitch i { position: absolute; left: 0; right: 0; display: block; mix-blend-mode: screen; }
  #vig { opacity: 1; background: radial-gradient(ellipse at 50% 46%, transparent 52%, rgba(0, 0, 0, .5) 100%); }
  #grain { opacity: .07; mix-blend-mode: overlay; background-size: 128px 128px; }
  #flash { background: #fff; } #fade { background: #000; opacity: 1; }

  #title { display: flex; flex-direction: column; align-items: center; top: 20%; bottom: auto; text-align: center; }
  #title .t1 { font-family: 'Saira Stencil One', Impact, sans-serif; font-size: calc(var(--u) * 25); line-height: 1; letter-spacing: calc(var(--u) * 2.2); margin-right: calc(var(--u) * -2.2); color: #f1e7c8; text-shadow: 0 0 calc(var(--u) * 5) rgba(0, 0, 0, .85), 0 calc(var(--u) * .6) calc(var(--u) * 1.4) rgba(0, 0, 0, .9); }
  #title .ln { width: calc(var(--u) * 46); height: calc(var(--u) * .5); background: var(--amber); margin: calc(var(--u) * 2.4) 0 0; box-shadow: 0 0 calc(var(--u) * 2) rgba(232, 180, 70, .7); }

  .card { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-bottom: 8%; }
  #endcard svg { width: calc(var(--u) * 34); height: calc(var(--u) * 34); }
  #endcard .e1 { font-family: 'Saira Stencil One', Impact, sans-serif; font-size: calc(var(--u) * 13); letter-spacing: calc(var(--u) * 1.6); margin: calc(var(--u) * 5) calc(var(--u) * -1.6) 0 0; color: #f1e7c8; }
  #brand .b1 { font-family: 'Saira Stencil One', Impact, sans-serif; font-size: calc(var(--u) * 8.4); letter-spacing: calc(var(--u) * 1); margin-right: calc(var(--u) * -1); color: #f3ecd9; text-transform: uppercase; white-space: nowrap; }
  #brand .b3 { font-size: calc(var(--u) * 3); letter-spacing: calc(var(--u) * .8); margin-top: calc(var(--u) * 4); color: var(--amber); text-transform: uppercase; }
  #brand img { max-width: 60%; max-height: 34%; margin-bottom: calc(var(--u) * 4); }

  /* menu */
  #menu { display: flex; flex-direction: column; align-items: center; background: linear-gradient(180deg, rgba(4, 8, 8, .5) 0%, rgba(4, 8, 8, .15) 34%, rgba(4, 8, 8, .78) 100%); transition: opacity .35s; }
  #menu.off { opacity: 0; pointer-events: none; }
  #menu .corner { position: absolute; left: calc(var(--u) * 5); top: calc(var(--u) * 5); font-size: calc(var(--u) * 3); letter-spacing: calc(var(--u) * .6); color: #e9e2cf; text-transform: uppercase; }
  #menu .m1 { margin-top: 30%; font-family: 'Saira Stencil One', Impact, sans-serif; font-size: calc(var(--u) * 27); line-height: 1; letter-spacing: calc(var(--u) * 2.4); margin-right: calc(var(--u) * -2.4); color: #f1e7c8; text-shadow: 0 0 calc(var(--u) * 6) rgba(0, 0, 0, .9); }
  #menu .ln { width: calc(var(--u) * 50); height: calc(var(--u) * .5); background: var(--amber); margin: calc(var(--u) * 2.4) 0 calc(var(--u) * 1.4); }
  #menu .mid { flex: 1; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  #play { width: calc(var(--u) * 58); padding: calc(var(--u) * 4.2) 0; font-family: 'Saira Stencil One', Impact, sans-serif; font-size: calc(var(--u) * 8.5); letter-spacing: calc(var(--u) * 1.6); color: #14110a; background: var(--amber); border-radius: calc(var(--u) * 1); box-shadow: 0 0 calc(var(--u) * 7) rgba(232, 180, 70, .35); }
  #play:hover { background: #f6c75c; }
  .row { width: calc(var(--u) * 58); display: flex; margin-top: calc(var(--u) * 3); gap: calc(var(--u) * 3); }
  .row button { flex: 1; padding: calc(var(--u) * 3) 0; font-size: calc(var(--u) * 3.6); letter-spacing: calc(var(--u) * .4); border: calc(var(--u) * .3) solid rgba(233, 226, 207, .45); border-radius: calc(var(--u) * 1); background: rgba(8, 12, 12, .55); }
  .row button:hover { border-color: var(--amber); color: var(--amber); }
  #info { margin: calc(var(--u) * 4) 0 calc(var(--u) * 7); font-size: calc(var(--u) * 2.6); line-height: 1.7; text-align: center; color: #a9a391; min-height: calc(var(--u) * 14); }
  #info b { color: #e9e2cf; font-weight: 400; }
  #turn { display: none; position: absolute; left: 0; right: 0; top: 12%; text-align: center; font-size: calc(var(--u) * 3.4); color: var(--amber); }

  /* seek bar: hidden unless the mouse moves or the screen is tapped */
  #seek { top: auto; bottom: calc(var(--u) * 3.5); left: calc(var(--u) * 4); right: calc(var(--u) * 4); height: calc(var(--u) * 9); display: flex; align-items: center; gap: calc(var(--u) * 2.5); opacity: 0; transition: opacity .3s; pointer-events: none; font-size: calc(var(--u) * 3); }
  #seek.show { opacity: 1; pointer-events: auto; }
  #pp { width: calc(var(--u) * 8); height: calc(var(--u) * 8); font-size: calc(var(--u) * 4.4); line-height: 1; background: rgba(0, 0, 0, .55); border-radius: 50%; }
  #bar { flex: 1; height: calc(var(--u) * 7); position: relative; cursor: pointer; touch-action: none; }
  #bar .tr { position: absolute; left: 0; right: 0; top: 50%; height: calc(var(--u) * 1); margin-top: calc(var(--u) * -.5); background: rgba(255, 255, 255, .28); border-radius: 99px; overflow: hidden; }
  #bar .fl { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--amber); }
  #bar .mk { position: absolute; top: 50%; width: 1px; height: calc(var(--u) * 2.2); margin-top: calc(var(--u) * -1.1); background: rgba(255, 255, 255, .5); }
  #bar .kn { position: absolute; top: 50%; width: calc(var(--u) * 2.6); height: calc(var(--u) * 2.6); margin: calc(var(--u) * -1.3) 0 0 calc(var(--u) * -1.3); border-radius: 50%; background: #fff; }
  #tm { white-space: nowrap; text-shadow: 0 0 4px #000, 0 0 2px #000; }
  #tip { position: absolute; bottom: calc(var(--u) * 9); transform: translateX(-50%); background: rgba(0, 0, 0, .8); padding: calc(var(--u) * 1) calc(var(--u) * 2); border-radius: calc(var(--u) * .8); white-space: nowrap; font-size: calc(var(--u) * 2.8); display: none; }
</style>
</head>
<body>
<div id="frame">
  <canvas id="c"></canvas>
  <div id="helmet" class="ov"><i class="scan"></i><i class="edge"></i><b class="a"></b><b class="b"></b><b class="c"></b><b class="d"></b></div>
  <div id="glitch" class="ov"></div>
  <div id="vig" class="ov"></div>
  <div id="grain" class="ov"></div>
  <div id="flash" class="ov"></div>
  <div id="fade" class="ov"></div>
  <div id="title" class="ov"><div class="t1">SILO</div><div class="ln"></div></div>
  <div id="endcard" class="ov card">
    <svg viewBox="0 0 100 100" fill="none" stroke="#e8b446"><circle cx="50" cy="50" r="46" stroke-width="1.6"/><circle cx="50" cy="50" r="34" stroke-width="1" opacity=".7"/><circle cx="50" cy="50" r="22" stroke-width="1" opacity=".5"/><circle cx="50" cy="50" r="9" stroke-width="2.4"/><path d="M50 4v16M50 80v16M4 50h16M80 50h16" stroke-width="1.2" opacity=".8"/></svg>
    <div class="e1">SILO</div>
  </div>
  <div id="brand" class="ov card"><img id="blogo" alt="" hidden><div class="b1" id="ben"></div><div class="b3" id="btag"></div></div>
  <div id="seek"><button id="pp" aria-label="Play or pause">❚❚</button><div id="bar"><div class="tr"><div class="fl"></div></div><div class="kn"></div><div id="tip"></div></div><div id="tm">00:00 / 01:00</div></div>
  <div id="menu">
    <div class="corner" id="cen"></div>
    <div id="turn">Hold your phone upright ↑</div>
    <div class="m1">SILO</div><div class="ln"></div>
    <div class="mid"></div>
    <button id="play">PLAY</button>
    <div class="row"><button id="bsound">SOUND: ON</button><button id="bfull">FULLSCREEN</button></div>
    <div id="info"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="js/story.js"></script>
<script src="js/sound.js"></script>
<script src="js/cinematic.js"></script>
</body>
</html>
